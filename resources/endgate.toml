# Config version. Do not change this
config-version = "1.0"

# What port should the proxy be bound to? By default, we'll bind to all addresses on port 19132.
bind = "0.0.0.0:19132"

# What should be the MOTD? This gets displayed when the player adds your server to
# their server list.
motd = "Endgate Server"

# What should we display for the maximum number of players?
show-max-players = 500

# Should we authenticate players with Xbox Live? By default, this is on.
online-mode = true

[servers]
# Configure your servers here. Each key represents the server's name, and the value
# represents the IP address of the server to connect to.
lobby = "127.0.0.1:19133"

# In what order we should try servers when a player logs in or is kicked from a server.
try = [
    "lobby"
]

[nethernet]
# Should players be able to join over NetherNet as well as RakNet?
enabled = true

# Which addresses should players reach the proxy at over NetherNet? Leave empty to use this
# machine's own addresses.
public-addresses = []

# Which certificate chain and private key (PEM) should NetherNet join requests be served over HTTPS
# with? Leave both empty to serve plain HTTP only.
tls-certificate-chain = ""
tls-private-key = ""

# Where is the key that identifies the proxy to players kept? It is created if missing.
identity-key = "identity.pem"

# What name should players see when asked whether to trust the proxy?
identity-domain = "Endgate"

[advanced]
# How much compression should be done (from 0-9). The default is -1, which uses the
# default level of 6.
compression-level = -1
